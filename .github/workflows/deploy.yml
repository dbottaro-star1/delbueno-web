name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# No permissions by default. Each job below asks for only what it needs.
permissions: {}

# A deploy that is already running is never cut off halfway; a newer push waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

# Deployment target: production on the custom domain delbuenostudio.com (public/CNAME).
# The domain is verified on the GitHub account, and Cloudflare sits in front for DNS,
# redirects and security headers (see docs/security/cloudflare.md and redirects/README.md).
# For a noindex preview build instead, use PREVIEW 'true', BASE_PATH '/delbueno-web' and
# SITE_URL 'https://dbottaro-star1.github.io', and remove public/CNAME.
env:
  PREVIEW: 'false'
  BASE_PATH: /
  SITE_URL: https://delbuenostudio.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages looks up the Pages site; upload-pages-artifact needs no token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # See ci.yml for why install scripts are off and no `npm rebuild` is needed.
      - run: npm ci --ignore-scripts

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Audit production dependencies (fails on high or critical)
        run: npm audit --audit-level=high --omit=dev

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Copy lint (no em dashes, en dashes or middle dots)
        run: npm run lint:copy

      - name: Content Security Policy (inline script hashes, no inline styles, meta tag, docs in sync)
        run: npm run check:csp

      - name: SEO (title and description length, unique, canonical, absolute og:image, one h1, JSON-LD parses)
        run: npm run check:seo

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          # Needed for dist/.well-known/security.txt. The build output holds no other dotfiles.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
