name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# No permissions by default. Each job below asks for only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

# Deployment target. Today the site is a noindex preview on GitHub Pages.
#
# To switch to the custom domain delbuenostudio.com:
#   1. Add a file public/CNAME that contains: delbuenostudio.com
#   2. Change the three values below to: PREVIEW 'false', BASE_PATH '/', SITE_URL 'https://delbuenostudio.com'
#   3. In the repository settings (Pages), set the custom domain and enforce HTTPS.
#   4. Import the redirects (see redirects/README.md).
env:
  PREVIEW: 'true'
  BASE_PATH: /delbueno-web
  SITE_URL: https://dbottaro-star1.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages looks up the Pages site; upload-pages-artifact needs no token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Audit production dependencies (fails on high or critical)
        run: npm audit --audit-level=high --omit=dev

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Copy lint (no em dashes, en dashes or middle dots)
        run: npm run lint:copy

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          # Needed for dist/.well-known/security.txt. The build output holds no other dotfiles.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
