name: CI

# Runs the same checks as the deploy workflow, without deploying.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Audit production dependencies (fails on high or critical)
        run: npm audit --audit-level=high --omit=dev

      - name: Type check
        run: npm run check

      # Built with the default (production) settings, which is what check:redirects expects.
      - name: Build
        run: npm run build

      - name: Copy lint (no em dashes, en dashes or middle dots)
        run: npm run lint:copy

      - name: Redirect targets exist
        run: npm run check:redirects
